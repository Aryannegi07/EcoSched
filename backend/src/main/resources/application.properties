# ---------------------------------------------------------------
# EcoSched backend configuration.
# NO passwords are stored here. Values come from environment
# variables, or from a .env file (see .env.example in the project root).
# Real OS environment variables override the .env file.
# ---------------------------------------------------------------
spring.application.name=ecosched-backend

# Optionally read KEY=value lines from .env (works from backend/ or from the project root)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# MySQL connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecosched}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:ecosched_user}
# No default on purpose: the app refuses to start if DB_PASSWORD is not provided.
spring.datasource.password=${DB_PASSWORD}

# database/schema.sql is the single source of truth for the tables,
# so Hibernate must NOT create/alter them.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# JSON uses snake_case (request_id, user_id, item_id ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Origins (comma separated) allowed to call the API from a browser - the React app
ecosched.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# C scheduler (scheduler/ecosched_scheduler). Leave SCHEDULER_BIN empty to auto-detect
# ../scheduler/ecosched_scheduler (run from backend/) or scheduler/ecosched_scheduler (run from the project root).
ecosched.scheduler.path=${SCHEDULER_BIN:}
ecosched.scheduler.timeout-seconds=${SCHEDULER_TIMEOUT_SECONDS:10}
spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_IMAGE_SIZE:5MB}
ecosched.upload-dir=${UPLOAD_DIR:uploads}
